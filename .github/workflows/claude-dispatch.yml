name: Claude Remote Task

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "What should Claude do?"
        required: true

jobs:
  claude-task:
    runs-on: ubuntu-latest
    # Least privilege for a task that may push a branch and open a PR.
    # Only users with write access can trigger workflow_dispatch.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are a senior software engineer working on a chess analysis web app.

            Task:
            ${{ github.event.inputs.prompt }}

            Requirements:
            - Do not break existing functionality
            - Focus only on relevant files
            - Keep changes minimal and clean
            - Preserve frontend/backend structure
            - Ensure real-time updates remain functional
